<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>W&B raw training / eval curves</title>
<style>
@font-face{font-family:MopdSans;src:url('fonts/MopdSans.woff') format('woff');font-display:swap}
body{font:16px/1.6 MopdSans,system-ui,sans-serif;background:#f5f7f8;color:#263845;margin:0}main{max-width:1140px;margin:auto;padding:32px 22px}h1{font-size:28px}a{color:#27699c}.box{padding:22px;background:white;border:1px solid #dce4e9;border-radius:8px;margin:16px 0}.controls{display:flex;gap:18px;flex-wrap:wrap}.controls label{min-width:0;max-width:100%}*{box-sizing:border-box}label{display:flex;flex-direction:column;font-size:14px;gap:6px}select{max-width:100%;padding:9px;border:1px solid #bbc8d1;background:white;color:#263845;font:inherit}#run{max-width:360px}#metric{max-width:630px}svg{width:100%;height:auto;touch-action:pan-y}code{font-size:13px;overflow-wrap:anywhere}#readout{font:13px/1.6 monospace,MopdSans,sans-serif;min-height:48px;overflow-wrap:anywhere}button{font:inherit;cursor:pointer;padding:8px 14px;background:#27699c;color:white;border:0;border-radius:4px}.meta{font-size:14px;color:#5c7080}.key{overflow-wrap:anywhere}output{font-variant-numeric:tabular-nums}
</style><main><a href="index.html">← 返回论文图</a><h1>W&amp;B 原始 training / eval 曲线</h1>
<p>从同次 <code>wandb.log(metrics)</code> 调用前写入的本地scalar镜像读取。保留全部原始采样点；默认平滑为0。移动指针可查看数值及源文件行号。</p>
<div class="box controls"><label>Run<select id="run"></select></label><label>指标与记录时钟<select id="metric"></select></label>
<label>额外 EMA 叠加（原始线始终保留）<input type="range" id="smooth" min="0" max="95" step="5" value="0"><output id="smoothing">关闭 · raw only</output></label></div>
<div class="box"><h2 id="key" class="key"></h2><p id="meta" class="meta"></p><svg id="chart" viewBox="0 0 1050 470" role="img" aria-label="原始训练或评估曲线"></svg><div id="readout">移动到曲线上查看原始记录。</div><p><button id="download">下载当前原始曲线 CSV</button> <a id="wandb" target="_blank" rel="noreferrer">打开 W&amp;B run</a></p><p id="note" class="meta"></p></div>
<p class="meta">train/step 是梯度microbatch日志序号，mopd/update 才是optimizer更新步数。评估使用实际checkpoint step；重复attempt保持独立点。未记录的policy entropy不以负log-prob代替。完整来源与数值：<a href="../../experiments/paper_curves_20260908/raw_curve_values.csv">全部曲线CSV</a>。</p>
</main><script type="application/json" id="data">__CURVE_DATA__</script><script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent), series=data.series;
const run=document.getElementById('run'), metric=document.getElementById('metric'), slider=document.getElementById('smooth');
const svg=document.getElementById('chart'), NS='http://www.w3.org/2000/svg';
const unique=[...new Map(series.map(s=>[s.run,s.label])).entries()];
for(const [value,label] of unique){run.add(new Option(label+' · '+value,value));}
run.value='m-pg-s42';let current=null, project=null;
function options(){metric.innerHTML='';for(let i=0;i<series.length;i++){const s=series[i];if(s.run===run.value)metric.add(new Option(s.key+' ['+s.namespace+']',String(i)));}const chosen=[...metric.options].find(o=>series[Number(o.value)].key==='mopd/task/math/teacher_loss');if(chosen)metric.value=chosen.value;draw();}
function element(tag,attrs,text){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
function pathFor(xs,ys,X,Y,breaks){let path='';for(let i=0;i<xs.length;i++){const move=i===0||(breaks&&xs[i]-xs[i-1]>1);path+=(move?'M':'L')+X(xs[i]).toFixed(2)+','+Y(ys[i]).toFixed(2);}return path;}
function format(v){if(v===0)return '0';return Math.abs(v)>=10000||Math.abs(v)<.001?v.toExponential(2):Number(v.toPrecision(5)).toString();}
function draw(){current=series[Number(metric.value)];if(!current)return;const s=current;svg.replaceChildren();
 document.getElementById('key').textContent=s.key;document.getElementById('meta').textContent=s.label+' · '+s.x.length+' 个原始点 · 横轴 '+s.clock;
 document.getElementById('note').textContent=s.note;document.getElementById('readout').textContent='移动到曲线上查看原始记录。';
 const link=document.getElementById('wandb');link.hidden=!s.url;if(s.url)link.href=s.url;
 let xmin=Math.min(...s.x),xmax=Math.max(...s.x),ymin=Math.min(...s.y),ymax=Math.max(...s.y);
 if(xmin===xmax){xmin-=1;xmax+=1;}const pad=(ymax-ymin)*.08||Math.max(Math.abs(ymin)*.05,.01);ymin-=pad;ymax+=pad;
 const left=96,right=1010,top=28,bottom=395,X=x=>left+(x-xmin)/(xmax-xmin)*(right-left),Y=y=>bottom-(y-ymin)/(ymax-ymin)*(bottom-top);project={X,Y,left,right,top,bottom,xmin,xmax};
 for(let i=0;i<=5;i++){const y=ymin+(ymax-ymin)*i/5,x=xmin+(xmax-xmin)*i/5;element('line',{x1:left,x2:right,y1:Y(y),y2:Y(y),stroke:'#e3e9ed'});element('text',{x:left-12,y:Y(y)+5,'text-anchor':'end',fill:'#566975','font-size':13},format(y));element('text',{x:X(x),y:bottom+26,'text-anchor':'middle',fill:'#566975','font-size':13},format(x));}
 element('line',{x1:left,x2:right,y1:bottom,y2:bottom,stroke:'#556977'});element('line',{x1:left,x2:left,y1:top,y2:bottom,stroke:'#556977'});
 element('text',{x:(left+right)/2,y:455,'text-anchor':'middle',fill:'#263845','font-size':16},data.clocks[s.clock]||s.clock);
 element('path',{d:pathFor(s.x,s.y,X,Y,s.namespace!=='eval'),fill:'none',stroke:'#27699c','stroke-width':s.namespace==='eval'?1.8:1.15});
 if(s.namespace==='eval'||s.x.length<40){for(let i=0;i<s.x.length;i++)element('circle',{cx:X(s.x[i]),cy:Y(s.y[i]),r:4,fill:'white',stroke:'#27699c','stroke-width':2});}
 const weight=Number(slider.value)/100;document.getElementById('smoothing').textContent=weight?'EMA history weight = '+weight.toFixed(2)+'（额外橙线）':'关闭 · raw only';
 if(weight){let v=s.y[0];const ys=s.y.map((y,i)=>{v=i===0||s.x[i]-s.x[i-1]>1?y:weight*v+(1-weight)*y;return v;});element('path',{d:pathFor(s.x,ys,X,Y,s.namespace!=='eval'),fill:'none',stroke:'#c05d28','stroke-width':2.3});}
 element('circle',{id:'cursor',cx:0,cy:0,r:5,fill:'#c05d28',visibility:'hidden'});
}
svg.addEventListener('pointermove',event=>{if(!current||!project)return;const point=svg.createSVGPoint();point.x=event.clientX;point.y=event.clientY;const mouse=point.matrixTransform(svg.getScreenCTM().inverse()),s=current;let best=0,distance=Infinity;for(let i=0;i<s.x.length;i++){const dx=project.X(s.x[i])-mouse.x,dy=project.Y(s.y[i])-mouse.y,d=dx*dx+dy*dy;if(d<distance){distance=d;best=i;}}const cursor=document.getElementById('cursor');cursor.setAttribute('cx',project.X(s.x[best]));cursor.setAttribute('cy',project.Y(s.y[best]));cursor.setAttribute('visibility','visible');document.getElementById('readout').textContent=s.clock+' = '+s.x[best]+' | raw '+s.key+' = '+s.y[best]+'\n'+(s.sources?s.sources[best]:s.source)+':'+s.line[best];});
document.getElementById('download').addEventListener('click',()=>{const s=current;if(!s)return;const q=v=>'"'+String(v).replaceAll('"','""')+'"';const rows=[['run','metric','clock','step','raw_value','source','source_line'],...s.x.map((x,i)=>[s.run,s.key,s.clock,x,s.y[i],s.sources?s.sources[i]:s.source,s.line[i]])];const url=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')+'\n'],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=s.run+'_'+s.key.replaceAll('/','_')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
run.addEventListener('change',options);metric.addEventListener('change',draw);slider.addEventListener('input',draw);options();
</script></html>
